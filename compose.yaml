services:
  api-docs:
    build: .
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      BASE_PATH: ""
      TRUST_PROXY: "false"
      ENABLE_TRY_IT_OUT: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - \"http://127.0.0.1:3000$${BASE_PATH}/health\" || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

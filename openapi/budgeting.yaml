openapi: 3.0.3
info:
  title: Budgeting API Documentation
  version: 1.0.0
  description: >-
    This documentation is written for **developers**, **System Analysts**, and **Support**.


    Budgeting API is the Go service for non-MPP budget reports, actual reports, table loading, master sync, and audit
    logging.



    ## How To Use This Documentation


    1. Open a category from the sidebar. Start with **Authentication**, then **Reports** or **Budgeting**, then
    **Admin** for maintenance.

    2. Read **Authentication** at the top of that category before you test anything.

    3. Copy the sample request, replace placeholders, and send it from Postman, curl, or PowerShell.



    Placeholders look like `<access_token>`, `<base64(user:password)>`, or `<audit_admin_key>`. Sample body values such
    as `1` are safe fixtures, not real company codes.


    Most report POST calls share the same JSON body: `period`, required `closing_month` (1-12), and optional
    `outlet_id`, `company_id`, `department_id`, and `brand_id`. Successful report responses use `{ "IsError": false,
    "Status": "Success", "Data": ... }`.



    ## Authentication


    - **Public** — the HTML landing page at `/` has no login.

    - **HTTP Basic** — `Authorization: Basic <base64(user:password)>` with `API_AUTH_USER_ID` and `API_AUTH_PASSWORD`.
    Used by `GET /health` and `POST /api/v1/auth/token`.

    - **Bearer JWT** — `Authorization: Bearer <access_token>`. Call **Issue Token** first, then send the token to
    reports and budgeting routes.

    - **Admin API key** — purge of stale audit rows requires `X-Admin-Key: <audit_admin_key>` (`AUDIT_ADMIN_KEY`).


    Never put production secrets, customer personal data, or live credentials into examples or tickets.


    A reader-friendly portal with a category sidebar is available at `/docs/`. Swagger UI remains at `/swagger/`.
  contact:
    name: API Platform Team
servers:
  - url: "{scheme}://{host}"
    description: Replace host with the API environment you are testing (local, staging, or production).
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
      host:
        default: localhost:8080
        description: API hostname and optional port
tags:
  - name: Health
    description: >-
      **Authentication:** This category mixes public and protected endpoints (Public, HTTP Basic). Check Authentication
      at the top of the category, then the endpoint you are testing.


      **Who uses this:** Anyone checking whether the Budgeting API is up.


      Handled by `HealthHandler`.
  - name: Authentication
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (Bearer JWT, HTTP Basic). Read the
      sample headers before testing.


      **Who uses this:** Anyone who needs a session token before calling protected APIs.


      Handled by `AuthHandler`.
  - name: Reports
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (Bearer JWT). Read the sample headers
      before testing.


      **Who uses this:** Budgeting, finance, System Analysts, and Support.


      Handled by `ReportNonMPPPTHandler`.
  - name: Budgeting
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (Bearer JWT). Read the sample headers
      before testing.


      **Who uses this:** Budgeting, finance, System Analysts, and Support.


      Handled by `BudgetingNonMPPHandler`.
  - name: Admin
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (API Key). Read the sample headers
      before testing.


      **Who uses this:** Operations, DBAs, System Analysts, and Support.


      Handled by `AuditAdminHandler`.

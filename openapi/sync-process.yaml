openapi: 3.0.3
info:
  title: Sync Process API Documentation
  version: 1.0.0
  description: >-
    This documentation is written for **developers**, **System Analysts**, and **Support**.


    Sync Process API is the Go service that runs scheduled and on-demand data-sync jobs against SQL Server, with HTTP
    request audit logging in PostgreSQL.



    ## How To Use This Documentation


    1. Open a category from the sidebar. Start with **Health**, then the **Sync** job you need, then **Admin** for
    maintenance.

    2. Read **Authentication** at the top of that category before you test anything. Every protected route uses HTTP
    Basic.

    3. Copy the sample request, replace placeholders, and send it from Postman, curl, or PowerShell.



    Placeholders look like `<base64(user:password)>` or `<audit_admin_key>`. Sample body values such as `1` are safe
    fixtures, not real company codes.


    Most sync POST calls have no request body. A successful sync returns `{"status":"ok"}`. Jobs can run up to
    `SYNC_RUN_TIMEOUT_SEC` (default 3600 seconds).



    ## Authentication


    - **HTTP Basic** — `Authorization: Basic <base64(user:password)>` with `BASIC_AUTH_USER` and `BASIC_AUTH_PASSWORD`.
    `curl -u user:password` sends the same header.

    - **Admin API key** — purge of request logs also requires `X-Audit-Admin-Key: <audit_admin_key>`
    (`AUDIT_ADMIN_KEY`).


    Missing or invalid Basic credentials return **401** with `WWW-Authenticate: Basic realm="restricted"`. An invalid
    admin key returns **401** without a token flow.


    Never put production secrets, customer personal data, or live credentials into examples or tickets.


    A reader-friendly portal with a category sidebar is available at `/docs/`. Swagger UI remains at `/swagger/`.
  contact:
    name: API Platform Team
servers:
  - url: "{scheme}://{host}"
    description: Replace host with the API environment you are testing (local, staging, or production).
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
      host:
        default: localhost:8080
        description: API hostname and optional port
tags:
  - name: Health
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (HTTP Basic). Read the sample headers
      before testing.


      **Who uses this:** Anyone checking whether the Sync Process API is up.


      Handled by `HealthHandler`.
  - name: Sync
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (HTTP Basic). Read the sample headers
      before testing.


      **Who uses this:** Operations and Support when replaying a scheduled sync job.


      Handled by `SyncSupplierHandler`.
  - name: Admin
    description: >-
      **Authentication:** Every endpoint in this category requires authentication (HTTP Basic + API Key, HTTP Basic).
      Read the sample headers before testing.


      **Who uses this:** Operations, DBAs, System Analysts, and Support.


      Handled by `MsdbMailHandler`.

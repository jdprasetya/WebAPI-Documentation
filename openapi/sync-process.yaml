  /api/v1/admin/audit/request-logs/purge:
    post:
      tags:
        - Admin
      summary: Purge Request Logs
      operationId: auditLogHandlerPurgeRequestLogs
      responses:
        "200":
          description: Successful response. The live JSON shape can vary; compare it with this sample.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: success
                message: Request completed
                data: {}
          x-java-response-type: Object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                httpStatus: 401
                message: Unauthorized
          x-java-response-type: Object
        "500":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                httpStatus: 500
                message: Unauthorized
          x-java-response-type: Object
      x-source-controller: AuditLogHandler
      x-source-location: internal/modules/audit_log/handler.go:18
      x-source-http-method: POST
      x-audience: Operations, DBAs, System Analysts, and Support
      x-auth:
        type: HTTP Basic + API Key
        required: true
        summary: "Requires HTTP Basic authentication and an admin API key. Send `Authorization: Basic <base64(user:password)>`
          plus the extra header below. You can also use `curl -u user:password`."
        headers:
          - name: Authorization
            example: Basic <base64(user:password)>
            note: Replace with base64 of BASIC_AUTH_USER:BASIC_AUTH_PASSWORD, or use curl -u.
          - name: X-Audit-Admin-Key
            example: <audit_admin_key>
            note: ""
        raw: "HTTP Basic (Authorization: Basic <base64(user:password)>) + API/client/secret key (handler-level)"
      x-validation: []
      x-error-messages:
        - Unauthorized
      x-app-area: Admin
      security:
        - headerXAuditAdminKey: []
          basicAuth: []
      x-copy:
        curl: |-
          curl -X POST "{baseUrl}/api/v1/admin/audit/request-logs/purge" \
            -H "Authorization: Basic <base64(user:password)>" \
            -H "X-Audit-Admin-Key: <audit_admin_key>" \
            -H "Accept: application/json"
        powershell: |-
          $headers = @{
            "Authorization" = "Basic <base64(user:password)>"
            "X-Audit-Admin-Key" = "<audit_admin_key>"
            "Accept" = "application/json"
          }
          Invoke-RestMethod -Method POST -Uri "{baseUrl}/api/v1/admin/audit/request-logs/purge" -Headers $headers
        http: |-
          POST /api/v1/admin/audit/request-logs/purge HTTP/1.1
          Host: {host}
          Authorization: Basic <base64(user:password)>
          X-Audit-Admin-Key: <audit_admin_key>
          Accept: application/json
        url: "{baseUrl}/api/v1/admin/audit/request-logs/purge"
        all: >-
          Purge Request Logs

          POST {baseUrl}/api/v1/admin/audit/request-logs/purge


          Authentication: Requires HTTP Basic authentication and an admin API key. Send `Authorization: Basic
          <base64(user:password)>` plus the extra header below. You can also use `curl -u user:password`.


          Headers:

          Authorization: Basic <base64(user:password)>

          X-Audit-Admin-Key: <audit_admin_key>

          Accept: application/json


          curl:

          curl -X POST "{baseUrl}/api/v1/admin/audit/request-logs/purge" \
            -H "Authorization: Basic <base64(user:password)>" \
            -H "X-Audit-Admin-Key: <audit_admin_key>" \
            -H "Accept: application/json"
      description: >-
        Purge Request Logs is part of the Admin category.


        **Who this is for:** Operations, DBAs, System Analysts, and Support.


        **Authentication:** Requires HTTP Basic authentication and an admin API key. Send `Authorization: Basic
        <base64(user:password)>` plus the extra header below. You can also use `curl -u user:password`.



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Send the access token as `Authorization: Bearer <access_token>`. Copy the token from the Login response."
    headerXAuditAdminKey:
      type: apiKey
      in: header
      name: X-Audit-Admin-Key
      description: "Send `X-Audit-Admin-Key: <audit_admin_key>`. Replace the placeholder with the real credential."
    basicAuth:
      type: http
      scheme: basic
      description: "Send HTTP Basic credentials as `Authorization: Basic <base64(user:password)>`. Use BASIC_AUTH_USER and
        BASIC_AUTH_PASSWORD, or `curl -u user:password`."
  schemas:
    Error:
      type: object
      additionalProperties: true
      description: Error response shape varies by endpoint. Use HTTP status, known error messages, and the sample error JSON
        as a starting point.
      example:
        status: error
        httpStatus: 400
        message: Request failed. Check headers, required fields, and authentication.
